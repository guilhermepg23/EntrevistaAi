spring:
  application:
    name: entrevista-ia
  datasource:
    # Duas formas de apontar o banco, nesta ordem de precedência:
    #
    # 1. DATABASE_URL — a URL JDBC inteira, de uma vez. É o que usamos em
    #    produção (Supabase), onde o banco não se chama "entrevista_ia" (é
    #    "postgres"), a porta é a do pooler e o SSL é obrigatório:
    #    jdbc:postgresql://aws-0-<região>.pooler.supabase.com:5432/postgres?sslmode=require
    #
    # 2. DB_HOST / DB_PORT / DB_NAME em separado — o caminho do dia a dia.
    #    Os defaults cobrem o Postgres local / IntelliJ sem configurar nada. No
    #    Docker Compose, DB_HOST é sobrescrito para "postgres" (nome do serviço
    #    na rede interna do compose) via variável de ambiente do container.
    #
    # Usuário e senha ficam fora da URL de propósito: no Supabase o usuário do
    # pooler tem o formato "postgres.<ref-do-projeto>", e deixá-lo numa
    # variável própria evita ter que montar query string com credencial.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:entrevista_ia}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # Cobre os dois uploads da app: currículo PDF (POST /interviews/{id}/resume,
      # normalmente < 1MB) e o áudio da resposta falada (POST /interviews/transcribe,
      # webm/opus de alguns minutos raramente passa de poucos MB; a própria OpenAI
      # recusa áudio acima de 25MB). O limite existe só pra barrar arquivo
      # errado/gigante antes de gastar processamento.
      max-file-size: 20MB
      max-request-size: 20MB
  # SMTP do email de recuperação de senha. Sem MAIL_HOST definido, o
  # spring-boot-starter-mail NÃO autoconfigura o JavaMailSender e o
  # SmtpPasswordResetMailer passa a só logar o link (ver a classe).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  # O Flyway é o dono do schema desde a v1 (ver db/migration/V1__baseline.sql).
  # Roda as migrations pendentes no boot, antes de o Hibernate validar.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # O Supabase entrega um banco "postgres" com vários schemas próprios dele
    # (auth, storage, realtime...). Apontar explicitamente pro "public" evita
    # que o Flyway crie o flyway_schema_history no lugar errado.
    schemas: public
    # Rede de segurança pra um banco que JÁ tenha as tabelas mas nenhum
    # histórico do Flyway — o caso de quem subiu a aplicação na época do
    # ddl-auto=update, ou de um dump restaurado. Em vez de quebrar com
    # "table already exists", o Flyway marca a V1 como aplicada e segue da V2
    # em diante. Num banco vazio (Supabase novo) a flag não muda nada: a V1
    # roda normalmente. Se o schema pré-existente não bater com as entidades,
    # quem reclama em seguida é o ddl-auto=validate logo abaixo.
    baseline-on-migrate: true
  jpa:
    hibernate:
      # validate, não update: o Hibernate deixou de alterar o schema sozinho e
      # passou a só conferir se o banco bate com as entidades, falhando o boot
      # quando não bate. É o que torna as migrations obrigatórias — esquecer de
      # escrever a migration vira erro na hora de subir, não bug silencioso em
      # produção. Mudou entidade? Escreva um V<n>__descricao.sql junto.
      ddl-auto: validate
    show-sql: false
    # Explicitamente true (era o default implícito antes, gerando warning no
    # boot): entidades como Interview.questions/report são acessadas fora da
    # transação do service (ex.: InterviewResponse.from() no controller, ou no
    # histórico via InterviewRepository.findByUserOrderByCriadoEmDesc). Sem
    # open-in-view, essas chamadas quebrariam com LazyInitializationException.
    # Desligar isso exigiria mover a montagem dos DTOs pra dentro da camada
    # transacional (ou usar JOIN FETCH) — não vale o risco pra o tamanho atual
    # do projeto, mas fica registrado como troca consciente.
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Sem default proposital: sem JWT_SECRET definido, o boot falha em vez de
  # cair silenciosamente num valor previsível em produção.
  secret: ${JWT_SECRET}
  expiration-ms: 86400000 # 24h

app:
  # Base do front-end, usada pra montar o link do email de recuperação de senha
  # (<base>/redefinir-senha?token=...). Em produção aponta pra URL da Vercel.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    # Remetente do email de recuperação. Alguns provedores SMTP exigem que
    # bata com o usuário autenticado / domínio verificado.
    from: ${MAIL_FROM:no-reply@entrevista-ia.local}
  password-reset:
    # Validade do token de recuperação, em minutos.
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
  rate-limit:
    # Limite por IP, por minuto (janela fixa). auth cobre /auth/**; ai cobre os
    # endpoints que chamam a OpenAI (criar entrevista, próxima pergunta,
    # transcrição, avaliação, análise de currículo). Ver security/RateLimitFilter.
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:60}
    ai-per-minute: ${RATE_LIMIT_AI_PER_MINUTE:40}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  # Modelo de transcrição de áudio (POST /interviews/transcribe). gpt-4o-mini-transcribe
  # é mais barato e mais preciso que o whisper-1 antigo; troque via env se precisar.
  transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}

# Origens do front-end autorizadas a chamar a API pelo navegador (ver
# SecurityConfig.corsConfigurationSource()). Múltiplas origens separadas por
# vírgula. 5173 = porta padrão do Vite; 3000 = fallback comum de outras
# ferramentas React.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  # PORT é injetada automaticamente por plataformas como Render/Railway; local
  # e no Docker Compose continua caindo no default 8080 de sempre.
  port: ${PORT:8080}

logging:
  level:
    com.guilherme.entrevistaia: INFO
