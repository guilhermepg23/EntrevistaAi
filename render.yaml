# Blueprint do Render: cria o backend a partir do Dockerfile em backend/.
# Pra usar: no dashboard do Render, "New +" -> "Blueprint" -> aponte pro
# repositório no GitHub.
#
# O BANCO NÃO MORA MAIS AQUI. Antes este arquivo também declarava um Postgres
# do Render (bloco "databases:") e injetava host/porta/usuário/senha via
# fromDatabase. O plano free do Postgres do Render expira ~30 dias depois de
# criado e derruba a aplicação junto, então o banco foi movido pro Supabase,
# cujo free tier não tem data de validade. A contrapartida é que as credenciais
# deixam de ser automáticas: DATABASE_URL, DB_USERNAME e DB_PASSWORD agora são
# "sync: false" e precisam ser coladas no dashboard (ver README).
#
# Todo "sync: false" significa a mesma coisa: o Render pede o valor no
# dashboard em vez de lê-lo do repositório — ou porque é segredo, ou porque
# depende de algo que só existe depois do deploy (a URL do Vercel, por exemplo).
services:
  - type: web
    name: entrevista-ia-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # /health é um endpoint próprio (HealthController), público e mínimo — só
    # responde 200 {"status":"UP"} depois que o Spring terminou de subir. Sem
    # Spring Boot Actuator de propósito (dependência a mais só pra isso).
    healthCheckPath: /health
    envVars:
      # Conexão com o Supabase. Pegue os três valores em Project Settings ->
      # Database -> Connection string -> JDBC, aba "Session pooler".
      #
      # Use o SESSION POOLER (porta 5432, host *.pooler.supabase.com), não a
      # conexão direta: o host direto (db.<ref>.supabase.co) só resolve em
      # IPv6, e o Render não alcança IPv6 sem o add-on pago de IPv4. O pooler
      # de transação (porta 6543) também serve, mas desabilita prepared
      # statements e exigiria "?prepareThreshold=0" na URL — o de sessão
      # conversa melhor com o HikariCP/Hibernate.
      #
      # Formato: jdbc:postgresql://aws-0-<região>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      # No pooler o usuário tem o formato "postgres.<ref-do-projeto>".
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Recuperação de senha por email. Todos com "sync: false": preenchidos no
      # dashboard. Enquanto MAIL_HOST ficar em branco, o backend sobe normal e
      # só loga o link de recuperação em vez de enviar (ver SmtpPasswordResetMailer).
      - key: FRONTEND_BASE_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
